# YOLO11 object detection model with P3-P5 outputs (simple CNN backbone with extra stride-1 convs)

# Parameters
nc: 80  # number of classes (请改为你的类别数)
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

ch: 3

# Simple CNN backbone: 每个stage一次下采样(步幅=2) + 若干 3x3 s=1 卷积以提高参数量
backbone:
  # [from, repeats, module, args]
  - [-1, 1, JpegFusionModule, [64, 128,2]]     # 0  P1/2
  - [-1, 1, Conv, [64, 3, 1]]     # 1  额外 s=1

  - [-1, 1, Conv, [128, 3, 2]]    # 2  P2/4
  - [-1, 2, Conv, [128, 3, 1]]    # 3 额外 s=1 ×2

  - [-1, 1, Conv, [256, 3, 2]]    # 4  P3/8
  - [-1, 3, Conv, [256, 3, 1]]    # 5 额外 s=1 ×3  → P3 用索引 8

  - [-1, 1, Conv, [512, 3, 2]]    # 6  P4/16
  - [-1, 3, Conv, [512, 3, 1]]    # 7 额外 s=1 ×3 → P4 用索引 12

  - [-1, 1, Conv, [1024, 3, 2]]   # 8 P5/32
  - [-1, 2, Conv, [1024, 3, 1]]   # 14-15 额外 s=1 ×2
  - [-1, 1, SPPF, [1024, 5]]      # 10 顶部特征（P5）→ P5 用索引 16

# YOLO11n head（与简化backbone对齐：P3=8，P4=12，P5=16）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 17
  - [[-1, 7], 1, Concat, [1]]                    # 18 cat P4
  - [-1, 2, C3k2, [512, False]]                   # 19-20

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 21
  - [[-1, 4], 1, Concat, [1]]                     # 22 cat P3
  - [-1, 2, C3k2, [256, False]]                   # 23-24 (P3/8-small) → 24

  - [-1, 1, Conv, [256, 3, 2]]                    # 25
  - [[-1, 13], 1, Concat, [1]]                    # 26 cat head P4（20）
  - [-1, 2, C3k2, [512, False]]                   # 27-28 (P4/16-medium) → 28

  - [-1, 1, Conv, [512, 3, 2]]                    # 29
  - [[-1, 10], 1, Concat, [1]]                    # 30 cat P5（16）
  - [-1, 2, C3k2, [1024, True]]                   # 31-32 (P5/32-large) → 32

  - [[16, 19, 22], 1, Detect, [nc]]               # Detect(P3, P4, P5)