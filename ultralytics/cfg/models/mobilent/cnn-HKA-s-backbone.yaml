# YOLO11 object detection model with P3-P5 outputs (simple CNN backbone with extra stride-1 convs)

# Parameters
nc: 4  # number of classes (请改为你的类别数)
scales:  # [depth, width, max_channels]
  s: [0.50, 0.25, 1024]
  n: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Simple CNN backbone: 每个stage一次下采样(步幅=2) + 若干 3x3 s=1 卷积以提高参数量
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]     # 0  P1/2
  - [-1, 1, Conv, [64, 3, 1]]     # 1  额外 s=1

  - [-1, 1, Conv, [128, 3, 2]]    # 2  P2/4
  - [-1, 2, CKAS_DAF, [128, 3, 1]]    # 3 额外 s=1 ×2

  - [-1, 1, Conv, [256, 3, 2]]    # 4  P3/8
  - [-1, 2, C3k2_HKA, [256, False]]    # 5 额外 s=1 ×3  → P3 用索引 8

  - [-1, 1, Conv, [512, 3, 2]]    # 6  P4/16
  - [-1, 2,C3k2_HKA, [256, False]]    # 7 额外 s=1 ×3 → P4 用索引 12

  - [-1, 1, Conv, [1024, 3, 2]]   # 8 P5/32
  - [-1, 2, C3k2_HKA, [512,False]]   # 14-15 额外 s=1 ×2
  - [-1, 1, SPPF, [1024, 5]]      # 10 顶部特征（P5）→ P5 用索引 16

# YOLO11n head（与简化backbone对齐：P3=8，P4=12，P5=16）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 11
  - [[-1, 7], 1, Concat, [1]]                    # 12 cat P4
  - [-1, 2, C3k2, [512, False]]                   # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 14
  - [[-1, 4], 1, Concat, [1]]                     # 15
  - [-1, 2, C3k2, [256, False]]                   # 16 (P3/8-small) → 24

  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [[-1, 13], 1, Concat, [1]]                    # 18 cat head P4（20）
  - [-1, 2, C3k2, [512, False]]                   # 19 (P4/16-medium) → 28

  - [-1, 1, Conv, [512, 3, 2]]                    # 20
  - [[-1, 10], 1, Concat, [1]]                    # 21 cat P5（16）
  - [-1, 2, C3k2, [1024, True]]                   # 22 (P5/32-large) → 32

  - [16, 1, NonLocalBlockND, [256, True, True]] # 23 (P5/32-large)
  - [19, 1, NonLocalBlockND, [512, True, True]] # 24 (P5/32-large)
  - [22, 1, NonLocalBlockND, [1024, True, True]] #25

  - [[23, 24, 25], 1, Detect, [nc]]               # Detect(P3, P4, P5)