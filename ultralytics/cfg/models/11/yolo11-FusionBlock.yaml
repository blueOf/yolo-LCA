# YOLO11 with FusionBlock - replaces Upsample/Downsample + Concat + C3k2 with gated-attention fusion
# FusionBlock fuses two multi-scale feature maps using element-wise gated attention:
#   - Downsample direction: adaptive avg pooling + gated attention
#   - Upsample direction: nearest-neighbor interpolation + gated attention
# All normalization uses BatchNorm2d inside Conv (native NCHW, no permutation overhead).

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone (unchanged)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head with FusionBlock
head:
  # Top-down (upsample) path: FusionBlock replaces nn.Upsample + Concat + C3k2
  # kv=10 (20x20, P5 deep features), q=6 (40x40, P4 backbone skip) -> 40x40
  - [[10, 6], 1, FusionBlock, [512]] # 11

  # kv=11 (40x40, fused P5+P4), q=4 (80x80, P3 backbone skip) -> 80x80
  - [[11, 4], 1, FusionBlock, [256]] # 12 (P3/8-small)

  # Bottom-up (downsample) path: FusionBlock replaces Conv stride-2 + Concat + C3k2
  # kv=12 (80x80, fused P3), q=11 (40x40, fused P4) -> 40x40
  - [[12, 11], 1, FusionBlock, [512]] # 13 (P4/16-medium)

  # kv=13 (40x40, fused P4), q=10 (20x20, P5 deep features) -> 20x20
  - [[13, 10], 1, FusionBlock, [1024]] # 14 (P5/32-large)

  - [[12, 13, 14], 1, Detect, [nc]] # Detect(P3, P4, P5)
