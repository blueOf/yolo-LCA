# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 4 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  n: [0.50, 0.25, 1024] # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  m: [0.50, 1.00, 512] # summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 1024] # summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 1024] # summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args[c2,......]]

  - [-1, 1, Conv, [17, 3,2,1]]                     # P0 320
  - [-1, 1, InvertedResidual, [12, 1]]   
  - [-1, 1, InvertedResidual, [17,2]]           #160
  - [-1, 1, InvertedResidual, [23,2]]           #80  p3
  - [-1, 1, InvertedResidual, [45,2]]    #40
  - [-1, 1, InvertedResidual, [45,1]]   #40
  - [-1, 1, InvertedResidual, [68,1]]
  - [-1, 1, InvertedResidual, [112,2]] #20
  - [-1, 1, InvertedResidual, [224,1]] #20
  - [-1, 1, Conv, [448, 3,1,1]]  #20

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #p10
  - [[-1, 5], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [68, False]] # 15 (head 80*80)

  - [-1, 1, Conv, [68, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [192, False]] # (head 40*40)

  - [-1, 1, Conv, [128, 3, 2]] #19
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [448, True]] #  

  - [15, 1, NonLocalBlockND, [68, True, True]] # 22 (P5/32-large)
  - [18, 1, NonLocalBlockND, [192, True, True]] # 23 (P5/32-large)
  - [21, 1, NonLocalBlockND, [448, True, True]] # 24 (P5/32-large)

  - [[22, 23, 24], 1, Detect, [nc]] # Detect(P3, P4, P5)
  # - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
