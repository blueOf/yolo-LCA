# Ultralytics YOLO 🚀, AGPL-3.0 license
# RT-DETR-ResNet18 object detection model with P3-P5 outputs.
# ResNet18 uses BasicBlock (two 3x3 convs, expansion=1) with [2, 2, 2, 2] blocks.
# Paper: ~20M params, ~60 GFLOPs (640x640 input).

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ResNetLayer, [3, 64, 1, True, 1]]        # 0: stem (7x7 conv + maxpool)
  - [-1, 1, ResNetLayer, [64, 64, 1, False, 2, 1]]    # 1: layer1 (2 BasicBlocks, 64 ch)
  - [-1, 1, ResNetLayer, [64, 128, 2, False, 2, 1]]   # 2: layer2 (2 BasicBlocks, 128 ch, stride 2)
  - [-1, 1, ResNetLayer, [128, 256, 2, False, 2, 1]]  # 3: layer3 (2 BasicBlocks, 256 ch, stride 2)
  - [-1, 1, ResNetLayer, [256, 512, 2, False, 2, 1]]  # 4: layer4 (2 BasicBlocks, 512 ch, stride 2)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 5
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]] # 7

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 9
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]] # X4 (11), fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 14
  - [[-2, -1], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, RepC3, [256, 0.5]] # X3 (16), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]] # 17, downsample_convs.0
  - [[-1, 12], 1, Concat, [1]] # cat Y4
  - [-1, 3, RepC3, [256, 0.5]] # F4 (19), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]] # 20, downsample_convs.1
  - [[-1, 7], 1, Concat, [1]] # cat Y5
  - [-1, 3, RepC3, [256, 0.5]] # F5 (22), pan_blocks.1

  - [[16, 19, 22], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # Detect(P3, P4, P5), ndl=3
