# YOLO11 with FusionBlock - replaces Upsample/Downsample + Concat + C3k2 with cross-attention fusion
# FusionBlock fuses two multi-scale feature maps using attention:
#   - Downsample direction: cross-attention with factor x factor spatial tokens
#   - Upsample direction: element-wise gated attention after nearest-neighbor expansion

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone (unchanged)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 1, FastLocalDETRBlock_v2, [512,1,4,2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head with FusionBlock
head:
  - [[5,7,-1], 1, FusionBlock, [512]] 

  - [[-1], 1, Detect, [nc]] # Detect(P3, P4, P5)
